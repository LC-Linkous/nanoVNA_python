[project]
name = "nvnapython"
version = "2.0.0"
authors = [
    { name = "LC-Linkous", email = "L.C.Linkous@gmail.com" }
]
description = "An UNOFFICIAL Python API for the NanoVNA series of vector network analyzers"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nanovna", "vna", "vector network analyzer", "s-parameters", "rf", "serial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
]
dependencies = [
    "pyserial>=3.5",
]
license = "GPL-2.0-only"
license-files = ["LICENSE*"]

[project.optional-dependencies]
plotting = [
    "numpy>=2.2.6",
    "matplotlib>=3.10.5",
    "pillow>=10.0",
    'pyqt5 ; platform_system == "Linux"',
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/LC-Linkous/nanoVNA_python"
"Repository" = "https://github.com/LC-Linkous/nanoVNA_python"
"Issues" = "https://github.com/LC-Linkous/nanoVNA_python/issues"
"Changelog" = "https://github.com/LC-Linkous/nanoVNA_python/blob/main/CHANGELOG.md"

[dependency-groups]
# `uv sync` installs these alongside the editable package; `uv run pytest`
# etc. then use the synced environment. This is the family-standard dev
# workflow (matches hackrfpy and tsapython). The `test` extra above remains
# for plain-pip consumers.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Blocking ruleset: F (pyflakes: real bugs -- unused imports, undefined
# names), E9 (syntax errors), and W (whitespace hygiene). Full E is a
# deferred, reviewed cleanup pass -- same policy as tsapython.
select = ["E9", "F", "W"]

[tool.mypy]
# BASIC gate: catches real type errors at default strictness and passes
# today. The package ships a py.typed marker promising downstream
# type-checkers real annotations; making that promise true requires the
# full annotation pass (`--disallow-untyped-defs` currently reports 145
# errors) -- the same deferred typing project tsapython completed for its
# 3.0.x line. Tighten this config when that pass lands.
files = ["src/nvnapython"]

[[tool.mypy.overrides]]
# pyserial ships no type stubs; treat its interface as dynamically typed
# rather than failing the import.
module = "serial.*"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "hardware: tests that require a physically connected NanoVNA device (skipped automatically when no device is detected; deselect with -m 'not hardware')",
]